<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gen Z Genre Roulette</title>

  <!-- PWA & Mobile App Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#06070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #06070b;
      --card-bg: rgba(13, 15, 24, 0.9);
      --active-color: #00ff88;
      --spotify: #1db954;
      --ytmusic: #ff0033;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Dynamic Glow */
    .ambient-glow {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.25) 0%, transparent 70%);
      filter: blur(65px);
      z-index: 0;
      pointer-events: none;
      transition: background 0.35s ease;
    }

    /* Top Information Section */
    .top-section {
      position: relative;
      z-index: 2;
      padding: 12px 16px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--active-color);
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--active-color);
      padding: 3px 12px;
      border-radius: 20px;
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.25);
      transition: all 0.35s ease;
    }

    .info-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid var(--active-color);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.35s ease;
    }

    .info-card.bump {
      transform: scale(1.02);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-pill {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--active-color);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--active-color);
      padding: 2px 8px;
      border-radius: 6px;
      transition: all 0.35s ease;
    }

    .vibe-text {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Title Row with Copy Button */
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .genre-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 23px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--active-color);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .copy-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.2);
    }

    .genre-description {
      font-size: 12px;
      line-height: 1.35;
      color: #d1d5db;
      min-height: 32px;
    }

    /* Top 10 Artists Scroll Container */
    .artists-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .artists-header {
      font-size: 9px;
      font-weight: 800;
      color: var(--active-color);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transition: color 0.35s ease;
    }

    .artists-scroll-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .artists-scroll-row::-webkit-scrollbar {
      display: none;
    }

    .artist-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      color: #f1f5f9;
    }

    /* Music Streaming Links */
    .links-row {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .music-link-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .music-link-btn.spotify {
      border-color: rgba(29, 185, 84, 0.4);
    }

    .music-link-btn.spotify:active {
      background: rgba(29, 185, 84, 0.2);
      transform: scale(0.96);
    }

    .music-link-btn.ytmusic {
      border-color: rgba(255, 0, 51, 0.4);
    }

    .music-link-btn.ytmusic:active {
      background: rgba(255, 0, 51, 0.2);
      transform: scale(0.96);
    }

    .music-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .spotify .music-dot { background: var(--spotify); box-shadow: 0 0 6px var(--spotify); }
    .ytmusic .music-dot { background: var(--ytmusic); box-shadow: 0 0 6px var(--ytmusic); }

    /* Bottom Roulette Stage */
    .roulette-wrapper {
      position: relative;
      width: 100%;
      height: 48vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 1;
    }

    .marker {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid var(--active-color);
      z-index: 10;
      filter: drop-shadow(0 0 12px var(--active-color));
      transition: border-top-color 0.25s ease, filter 0.25s ease;
    }

    .canvas-container {
      position: absolute;
      top: 14px;
      width: 450px;
      height: 450px;
      border-radius: 50%;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }

    .spin-center-btn {
      position: absolute;
      top: calc(14px + 225px);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle, #1a1c29 0%, #090a10 100%);
      border: 3px solid var(--active-color);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px var(--active-color), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      z-index: 9;
      transition: transform 0.15s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .spin-center-btn:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    .spin-center-btn span {
      font-size: 9px;
      color: var(--active-color);
      letter-spacing: 1px;
      transition: color 0.35s ease;
    }
  </style>
</head>

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const infoCard = document.getElementById('infoCard');
    const glow = document.getElementById('glow');
    const appBadge = document.getElementById('appBadge');
    const artistsHeader = document.getElementById('artistsHeader');
    const artistsContainer = document.getElementById('artistsContainer');
    const spotifyLink = document.getElementById('spotifyLink');
    const ytMusicLink = document.getElementById('ytMusicLink');
    const copyBtn = document.getElementById('copyBtn');
    const copyText = document.getElementById('copyText');
    const copyIcon = document.getElementById('copyIcon');

    const genreTitle = document.getElementById('genreTitle');
    const genreCategory = document.getElementById('genreCategory');
    const genreVibe = document.getElementById('genreVibe');
    const genreDesc = document.getElementById('genreDesc');

    const total = GENRES.length;
    const sliceAngle = (2 * Math.PI) / total;
    let currentAngle = 0;
    let velocity = 0;
    let isSpinning = false;
    let audioCtx = null;

    // Realistic Web Audio FX
    function playTickSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(480, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.035);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.035);
      } catch (e) {}

      // Haptic Vibration on Tick
      if (navigator.vibrate) {
        navigator.vibrate(10);
      }
    }

    function playWinSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.07);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.07 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.07);
          osc.stop(audioCtx.currentTime + idx * 0.07 + 0.3);
        });
      } catch(e) {}

      // Haptic Vibration Pattern on Selection Win
      if (navigator.vibrate) {
        navigator.vibrate([35, 45, 65]);
      }
    }

    function hexToRgba(hex, alpha) {
      hex = hex.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getCurrentIndex() {
      const normalized = (currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      let pointerAngle = (3 * Math.PI / 2 - normalized) % (2 * Math.PI);
      if (pointerAngle < 0) pointerAngle += 2 * Math.PI;
      return Math.floor(pointerAngle / sliceAngle) % total;
    }

    function renderWheel() {
      const size = canvas.width;
      const radius = size / 2;
      const activeIndex = getCurrentIndex();

      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.translate(radius, radius);
      ctx.rotate(currentAngle);

      for (let i = 0; i < total; i++) {
        const start = i * sliceAngle;
        const end = start + sliceAngle;
        const item = GENRES[i];
        const isActive = (i === activeIndex);

        // 1. Slice Base Gradient
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius - 8, start, end);
        ctx.lineTo(0, 0);

        if (isActive) {
          const activeGrad = ctx.createRadialGradient(0, 0, 80, 0, 0, radius);
          activeGrad.addColorStop(0, hexToRgba(item.color, 0.45));
          activeGrad.addColorStop(0.8, hexToRgba(item.color, 0.85));
          activeGrad.addColorStop(1, item.color);
          ctx.fillStyle = activeGrad;
        } else {
          const darkGrad = ctx.createRadialGradient(0, 0, 60, 0, 0, radius);
          const tint = (i % 2 === 0) ? 0.22 : 0.12;
          darkGrad.addColorStop(0, "#0c0d14");
          darkGrad.addColorStop(0.7, hexToRgba(item.color, tint));
          darkGrad.addColorStop(1, "#12141f");
          ctx.fillStyle = darkGrad;
        }
        ctx.fill();

        // 2. High-Contrast Laser Dividers
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(start) * (radius - 8), Math.sin(start) * (radius - 8));
        ctx.strokeStyle = isActive ? "#ffffff" : "rgba(255, 255, 255, 0.25)";
        ctx.lineWidth = isActive ? 3.5 : 1.8;
        ctx.stroke();

        // 3. Outer Neon Arc
        ctx.beginPath();
        ctx.arc(0, 0, radius - 8, start, end);
        ctx.strokeStyle = item.color;
        ctx.lineWidth = isActive ? 12 : 6;
        ctx.stroke();

        // 4. Slice Text Label
        ctx.save();
        const midAngle = start + sliceAngle / 2;
        ctx.translate(
          Math.cos(midAngle) * (radius - 128),
          Math.sin(midAngle) * (radius - 128)
        );
        ctx.rotate(midAngle + Math.PI);

        if (isActive) {
          ctx.shadowColor = item.color;
          ctx.shadowBlur = 14;
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 25px 'Space Grotesk', sans-serif";
        } else {
          ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
          ctx.shadowBlur = 6;
          ctx.fillStyle = "#f1f5f9";
          ctx.font = "600 22px 'Space Grotesk', sans-serif";
        }

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.name, 0, 0);
        ctx.restore();
      }

      // Outer Trim Ring
      ctx.beginPath();
      ctx.arc(0, 0, radius - 4, 0, 2 * Math.PI);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.restore();
    }

    let lastColor = "";
    function updateDetails(idx, forceBump = false) {
      const g = GENRES[idx];
      genreTitle.textContent = g.name;
      genreCategory.textContent = g.category;
      genreVibe.textContent = g.vibe;
      genreDesc.textContent = g.desc;

      // Render Top 10 Artist Badges
      artistsContainer.innerHTML = '';
      g.artists.forEach(artist => {
        const chip = document.createElement('span');
        chip.className = 'artist-chip';
        chip.textContent = artist;
        artistsContainer.appendChild(chip);
      });

      // Update Streaming Direct Links
      const query = encodeURIComponent(g.name + " music");
      spotifyLink.href = `https://open.spotify.com/search/${query}`;
      ytMusicLink.href = `https://music.youtube.com/search?q=${query}`;

      // Update dynamic colors
      if (lastColor !== g.color) {
        document.documentElement.style.setProperty('--active-color', g.color);
        glow.style.background = `radial-gradient(circle, ${g.color}55 0%, transparent 70%)`;
        lastColor = g.color;
      }

      if (forceBump) {
        infoCard.classList.remove('bump');
        void infoCard.offsetWidth;
        infoCard.classList.add('bump');
      }
    }

    // One-Tap Copy Genre Name
    copyBtn.addEventListener('click', async () => {
      const currentGenreName = genreTitle.textContent;
      try {
        await navigator.clipboard.writeText(currentGenreName);
        copyIcon.textContent = '✅';
        copyText.textContent = 'COPIED!';
        if (navigator.vibrate) navigator.vibrate(20);
        setTimeout(() => {
          copyIcon.textContent = '📋';
          copyText.textContent = 'COPY';
        }, 1800);
      } catch (err) {
        alert("Copied: " + currentGenreName);
      }
    });

    // Spin animation with Real-Time Sound & Passing Slice Updates
    let lastPassedIdx = -1;
    function spinAnimation() {
      if (velocity > 0.001) {
        currentAngle += velocity;
        velocity *= 0.984;

        const currentIdx = getCurrentIndex();
        if (currentIdx !== lastPassedIdx) {
          playTickSound();
          updateDetails(currentIdx, false);
          lastPassedIdx = currentIdx;
        }

        renderWheel();
        requestAnimationFrame(spinAnimation);
      } else {
        isSpinning = false;
        velocity = 0;
        const finalIdx = getCurrentIndex();
        updateDetails(finalIdx, true);
        renderWheel();
        playWinSound();
      }
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      velocity = Math.random() * 0.28 + 0.38;
      spinAnimation();
    }

    spinBtn.addEventListener('click', spin);
    canvas.addEventListener('click', spin);

    // Auto-wake listeners
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') renderWheel();
    });
    window.addEventListener('focus', renderWheel);
    window.addEventListener('pageshow', renderWheel);
    window.addEventListener('resize', renderWheel);

    // Initial render
    renderWheel();
    updateDetails(getCurrentIndex(), true);
  </script>
</body>
</html>
