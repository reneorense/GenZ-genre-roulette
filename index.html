<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gen Z Genre Roulette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06070b;
      --card-bg: rgba(13, 15, 24, 0.88);
      --active-color: #00ff88;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Dynamic Glow */
    .ambient-glow {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.25) 0%, transparent 70%);
      filter: blur(65px);
      z-index: 0;
      pointer-events: none;
      transition: background 0.35s ease;
    }

    /* Top Section */
    .top-section {
      position: relative;
      z-index: 2;
      padding: 14px 18px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--active-color);
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--active-color);
      padding: 4px 14px;
      border-radius: 20px;
      box-shadow: 0 0 16px rgba(0, 255, 136, 0.3);
      transition: all 0.35s ease;
    }

    .info-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid var(--active-color);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.35s ease;
    }

    .info-card.bump {
      transform: scale(1.02);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-pill {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--active-color);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--active-color);
      padding: 3px 10px;
      border-radius: 8px;
      transition: all 0.35s ease;
    }

    .vibe-text {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .genre-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .genre-description {
      font-size: 12.5px;
      line-height: 1.4;
      color: #d1d5db;
      min-height: 36px;
    }

    .artist-row {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .artist-label {
      font-weight: 800;
      color: var(--active-color);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.5px;
      transition: color 0.35s ease;
    }

    .artist-list {
      color: #ffffff;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom Roulette Stage */
    .roulette-wrapper {
      position: relative;
      width: 100%;
      height: 48vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 1;
    }

    /* Dynamic Arrow Pointer */
    .marker {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid var(--active-color);
      z-index: 10;
      filter: drop-shadow(0 0 12px var(--active-color));
      transition: border-top-color 0.25s ease, filter 0.25s ease;
    }

    .canvas-container {
      position: absolute;
      top: 14px;
      width: 450px;
      height: 450px;
      border-radius: 50%;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }

    /* Dynamic Center Spin Button */
    .spin-center-btn {
      position: absolute;
      top: calc(14px + 225px);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 94px;
      height: 94px;
      border-radius: 50%;
      background: radial-gradient(circle, #1a1c29 0%, #090a10 100%);
      border: 3px solid var(--active-color);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px var(--active-color), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      z-index: 9;
      transition: transform 0.15s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .spin-center-btn:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    .spin-center-btn span {
      font-size: 9px;
      color: var(--active-color);
      letter-spacing: 1px;
      transition: color 0.35s ease;
    }
  </style>
</head>
<body>

  <div class="ambient-glow" id="glow"></div>

  <!-- Top Info -->
  <div class="top-section">
    <div class="badge" id="appBadge">Gen Z Sonic Roulette</div>
    <div class="info-card" id="infoCard">
      <div class="card-meta">
        <span class="category-pill" id="genreCategory">Rage & Rap</span>
        <span class="vibe-text" id="genreVibe">Moshpit • 145 BPM</span>
      </div>
      <h2 class="genre-name" id="genreTitle">Rage Rap</h2>
      <p class="genre-description" id="genreDesc">Trap driven by euphoric, buzzing EDM synthesizer leads, distorted 808s, and hyper-futuristic rhythms.</p>
      <div class="artist-row">
        <span class="artist-label" id="artistLabel">Key Artists</span>
        <span class="artist-list" id="genreArtists">Playboi Carti, Yeat, Ken Carson</span>
      </div>
    </div>
  </div>

  <!-- Bottom Wheel -->
  <div class="roulette-wrapper">
    <div class="marker" id="marker"></div>
    <div class="canvas-container">
      <canvas id="wheelCanvas" width="900" height="900"></canvas>
    </div>
    <button class="spin-center-btn" id="spinBtn">
      SPIN
      <span id="spinBtnSub">TAP HERE</span>
    </button>
  </div>

  <script>
    // 20 Core Distinct Gen Z Genres with Vibrant Colors
    const GENRES = [
      { name: "Rage Rap", color: "#00ff88", category: "Rage & Rap", vibe: "Moshpit • 145 BPM", artists: "Playboi Carti, Yeat, Ken Carson", desc: "Trap driven by euphoric, buzzing EDM synthesizer leads, distorted 808s, and hyper-futuristic rhythms." },
      { name: "Hyperpop", color: "#00f0ff", category: "Digital & Glitch", vibe: "Maximalist • High BPM", artists: "100 gecs, SOPHIE, Charli xcx", desc: "Maximalist pop pushed into abrasive synthetic sound design, pitch-shifted vocals, and metallic bass drops." },
      { name: "Drift Phonk", color: "#ff0055", category: "Phonk & Dance", vibe: "Cowbell • 160 BPM", artists: "Kordhell, DVRST, Hensonn", desc: "Memphis rap acapellas combined with aggressive cowbells and car-drift video aesthetics." },
      { name: "Bedroom Pop", color: "#bf5af2", category: "Indie & Alt", vibe: "Chill • Tape Lo-Fi", artists: "Clairo, Beabadoobee, Cavetown", desc: "Intimate DIY home recordings with chorus guitars, vintage keys, and delicate vocal layers." },
      { name: "Brazilian Phonk", color: "#ffd60a", category: "Phonk & Dance", vibe: "Baile • 130 BPM", artists: "Phonkha, Slowboy, DJ FKU", desc: "Favela funk rhythms fused with distorted phonk cowbells and heavy sub-bass pulses." },
      { name: "Digicore", color: "#30d158", category: "Digital & Glitch", vibe: "Discord-Native", artists: "Jane Remover, midwxst, quinn", desc: "Hyperpop evolution mixing autotuned singing, bitcrushed chords, and fast breakbeats." },
      { name: "PluggnB", color: "#ff9f0a", category: "Rage & Rap", vibe: "Smooth 808s", artists: "Autumn!, Summrs, Kankan", desc: "Melodic fusion of minimalist plugg beats with 2000s R&B vocal runs and bright synths." },
      { name: "Nu-Gaze", color: "#da8fff", category: "Rock & Guitar", vibe: "Fuzz Shoegaze", artists: "Wisp, Julie, Narrow Head", desc: "Modern Gen Z revival of 90s shoegaze, featuring walls of fuzz pedals and whispery vocals." },
      { name: "Slowed + Reverb", color: "#64d2ff", category: "Internet Vibe", vibe: "Liminal Headspace", artists: "TikTok & YouTube Creators", desc: "Pitched-down, space-drenched songs creating a dreamy late-night emotional vibe." },
      { name: "Amapiano", color: "#ffcc00", category: "Global Club", vibe: "Log Drum Bass", artists: "Uncle Waffles, Kabza De Small", desc: "South African house hybrid of deep synths, soulful jazz chords, and wooden log drums." },
      { name: "Breakcore", color: "#ff2d55", category: "Digital & Glitch", vibe: "Frenetic • 180 BPM", artists: "Sewerslvt, Vertigoaway", desc: "Manic chopped Amen drum breaks colliding with anime soundbites and ambient pads." },
      { name: "Corridos Sad", color: "#00e5ff", category: "Global Waves", vibe: "Acoustic Sierreño", artists: "Ivan Cornejo, Eslabon Armado", desc: "Slow, melancholic 12-string guitar ballads exploring heartbreak through youth Latin perspectives." },
      { name: "Krushclub", color: "#10b981", category: "Rage & Rap", vibe: "Fast Nightcore", artists: "Odetari, Lumi Athena, Asteria", desc: "Fast-paced cross between Jersey club kicks, nightcore hooks, and abrasive rage synths." },
      { name: "Deftones-Core", color: "#af52de", category: "Rock & Guitar", vibe: "Alt-Metal Wave", artists: "Fleshwater, Loathe, Moodring", desc: "Drop-tuned heavy riffs meeting ethereal whispering vocals and 90s grunge bridges." },
      { name: "Sad Girl Indie", color: "#ffbe0b", category: "Indie & Alt", vibe: "Poetic & Stripped", artists: "Phoebe Bridgers, boygenius, Gracie", desc: "Confessional, poetic indie folk built around acoustic guitars and raw vocal storytelling." },
      { name: "Jersey Club", color: "#ff007f", category: "Phonk & Dance", vibe: "5-Beat Bounce", artists: "Bandmanrill, Lil Uzi Vert", desc: "Syncopated five-beat kick pattern accented by vocal chops, squeaks, and rapid rhythms." },
      { name: "Fast Techno", color: "#00f5d4", category: "Phonk & Dance", vibe: "155 BPM Rave", artists: "Creeds, Sara Landry, Nico Moreno", desc: "Hard techno and schranz kicks paired with energetic melodic pop hooks." },
      { name: "Modern Bossa", color: "#4cc9f0", category: "Indie & Alt", vibe: "Jazz Bedroom Pop", artists: "Laufey", desc: "Brazilian Bossa Nova chords and vintage big-band style with modern youth lyricism." },
      { name: "5th Gen K-Pop", color: "#fb5607", category: "Global Waves", vibe: "Liquid DnB Pop", artists: "NewJeans, ILLIT", desc: "K-pop embracing early 2000s liquid drum & bass breaks and breezy vocal delivery." },
      { name: "Dariacore", color: "#8338ec", category: "Digital & Glitch", vibe: "Meme Chop Chaos", artists: "leroy / Jane Remover", desc: "High-speed Jersey breakbeats layered with rapid 2000s pop and internet meme samples." }
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const infoCard = document.getElementById('infoCard');
    const glow = document.getElementById('glow');
    const appBadge = document.getElementById('appBadge');
    const artistLabel = document.getElementById('artistLabel');
    const spinBtnSub = document.getElementById('spinBtnSub');

    const genreTitle = document.getElementById('genreTitle');
    const genreCategory = document.getElementById('genreCategory');
    const genreVibe = document.getElementById('genreVibe');
    const genreDesc = document.getElementById('genreDesc');
    const genreArtists = document.getElementById('genreArtists');

    const total = GENRES.length;
    const sliceAngle = (2 * Math.PI) / total;
    let currentAngle = 0;
    let velocity = 0;
    let isSpinning = false;

    // Helper: convert hex to rgba
    function hexToRgba(hex, alpha) {
      hex = hex.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getCurrentIndex() {
      const normalized = (currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      let pointerAngle = (3 * Math.PI / 2 - normalized) % (2 * Math.PI);
      if (pointerAngle < 0) pointerAngle += 2 * Math.PI;
      return Math.floor(pointerAngle / sliceAngle) % total;
    }

    // Dynamic Render with Slice Ignition & Laser Dividers
    function renderWheel() {
      const size = canvas.width;
      const radius = size / 2;
      const activeIndex = getCurrentIndex();

      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.translate(radius, radius);
      ctx.rotate(currentAngle);

      for (let i = 0; i < total; i++) {
        const start = i * sliceAngle;
        const end = start + sliceAngle;
        const item = GENRES[i];
        const isActive = (i === activeIndex);

        // 1. Dynamic Slice Background Fill
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius - 8, start, end);
        ctx.lineTo(0, 0);

        if (isActive) {
          // ACTIVE SLICE: Vivid glowing tint + solid base
          const activeGrad = ctx.createRadialGradient(0, 0, 80, 0, 0, radius);
          activeGrad.addColorStop(0, hexToRgba(item.color, 0.45));
          activeGrad.addColorStop(0.8, hexToRgba(item.color, 0.85));
          activeGrad.addColorStop(1, item.color);
          ctx.fillStyle = activeGrad;
        } else {
          // INACTIVE SLICES: Alternating subtle tinted carbon glass
          const darkGrad = ctx.createRadialGradient(0, 0, 60, 0, 0, radius);
          const tint = (i % 2 === 0) ? 0.22 : 0.12;
          darkGrad.addColorStop(0, "#0c0d14");
          darkGrad.addColorStop(0.7, hexToRgba(item.color, tint));
          darkGrad.addColorStop(1, "#12141f");
          ctx.fillStyle = darkGrad;
        }
        ctx.fill();

        // 2. High-Contrast Laser Dividers
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(start) * (radius - 8), Math.sin(start) * (radius - 8));
        ctx.strokeStyle = isActive ? "#ffffff" : "rgba(255, 255, 255, 0.25)";
        ctx.lineWidth = isActive ? 3.5 : 1.8;
        ctx.stroke();

        // 3. Outer Rim Neon Arc
        ctx.beginPath();
        ctx.arc(0, 0, radius - 8, start, end);
        ctx.strokeStyle = item.color;
        ctx.lineWidth = isActive ? 12 : 6;
        ctx.stroke();

        // 4. Slice Text Label
        ctx.save();
        const midAngle = start + sliceAngle / 2;
        ctx.translate(
          Math.cos(midAngle) * (radius - 128),
          Math.sin(midAngle) * (radius - 128)
        );
        ctx.rotate(midAngle + Math.PI);

        if (isActive) {
          ctx.shadowColor = item.color;
          ctx.shadowBlur = 14;
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 25px 'Space Grotesk', sans-serif";
        } else {
          ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
          ctx.shadowBlur = 6;
          ctx.fillStyle = "#f1f5f9";
          ctx.font = "600 22px 'Space Grotesk', sans-serif";
        }

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.name, 0, 0);
        ctx.restore();
      }

      // Outer Trim Ring
      ctx.beginPath();
      ctx.arc(0, 0, radius - 4, 0, 2 * Math.PI);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.restore();
    }

    // Dynamic UI Theme Updater
    let lastColor = "";
    function updateDetails(idx, forceBump = false) {
      const g = GENRES[idx];
      genreTitle.textContent = g.name;
      genreCategory.textContent = g.category;
      genreVibe.textContent = g.vibe;
      genreDesc.textContent = g.desc;
      genreArtists.textContent = g.artists;

      // Update CSS theme variables
      if (lastColor !== g.color) {
        document.documentElement.style.setProperty('--active-color', g.color);
        glow.style.background = `radial-gradient(circle, ${g.color}55 0%, transparent 70%)`;
        lastColor = g.color;
      }

      if (forceBump) {
        infoCard.classList.remove('bump');
        void infoCard.offsetWidth;
        infoCard.classList.add('bump');
      }
    }

    // Real-Time Passing Slice Audio/Visual updates
    let lastPassedIdx = -1;
    function spinAnimation() {
      if (velocity > 0.001) {
        currentAngle += velocity;
        velocity *= 0.984; // Smooth realistic friction

        const currentIdx = getCurrentIndex();
        if (currentIdx !== lastPassedIdx) {
          updateDetails(currentIdx, false);
          lastPassedIdx = currentIdx;
        }

        renderWheel();
        requestAnimationFrame(spinAnimation);
      } else {
        isSpinning = false;
        velocity = 0;
        const finalIdx = getCurrentIndex();
        updateDetails(finalIdx, true);
        renderWheel();
      }
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      velocity = Math.random() * 0.28 + 0.38;
      spinAnimation();
    }

    spinBtn.addEventListener('click', spin);
    canvas.addEventListener('click', spin);

    // Auto-wake listeners for mobile idle prevention
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') renderWheel();
    });
    window.addEventListener('focus', renderWheel);
    window.addEventListener('pageshow', renderWheel);
    window.addEventListener('resize', renderWheel);

    // Initial render
    renderWheel();
    updateDetails(getCurrentIndex(), true);
  </script>
</body>
</html>
