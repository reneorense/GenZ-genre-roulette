<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gen Z Genre Roller</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#06070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #06070b;
      --card-bg: rgba(13, 15, 24, 0.94);
      --active-color: #00ff88;
      --rarity-color: #ffd700;
      --spotify: #1db954;
      --ytmusic: #ff0033;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 6px 12px 10px;
    }

    /* Ambient Dynamic Glow */
    .ambient-glow {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.25) 0%, transparent 70%);
      filter: blur(70px);
      z-index: 0;
      pointer-events: none;
      transition: background 0.35s ease;
    }

    /* Top Nav & Category Filter */
    .header-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--active-color);
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--active-color);
      padding: 3px 10px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
    }

    .drawer-trigger-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .drawer-trigger-btn:active {
      transform: scale(0.94);
    }

    .category-filter-row {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .category-filter-row::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 14px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-chip.active {
      background: var(--active-color);
      color: #000000;
      border-color: var(--active-color);
      font-weight: 800;
      box-shadow: 0 0 10px var(--active-color);
    }

    /* Main Info Card */
    .info-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid var(--active-color);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.85);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.35s ease;
    }

    .info-card.bump {
      transform: scale(1.02);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-pill {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--active-color);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--active-color);
      padding: 2px 7px;
      border-radius: 5px;
    }

    .rarity-pill {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 5px;
      color: #000;
      background: var(--rarity-color);
      box-shadow: 0 0 8px var(--rarity-color);
      letter-spacing: 0.5px;
    }

    .vibe-text {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .genre-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-group {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-action-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s ease;
    }

    .icon-action-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.2);
    }

    .icon-action-btn.fav.active {
      color: #ffd700;
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.15);
    }

    /* Enhanced Description Font Size */
    .genre-description {
      font-size: 13.5px;
      line-height: 1.45;
      color: #e2e8f0;
      font-weight: 500;
    }

    .genre-quick-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .stat-label {
      font-size: 8px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 10.5px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .links-row {
      display: flex;
      gap: 6px;
    }

    .music-link-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.15s ease;
    }

    .music-link-btn.spotify { border-color: rgba(29, 185, 84, 0.4); }
    .music-link-btn.ytmusic { border-color: rgba(255, 0, 51, 0.4); }

    .music-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .spotify .music-dot { background: var(--spotify); box-shadow: 0 0 6px var(--spotify); }
    .ytmusic .music-dot { background: var(--ytmusic); box-shadow: 0 0 6px var(--ytmusic); }

    /* Middle Top 10 Artists Board with Accordion Streaming */
    .artists-board {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(10, 12, 19, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .artists-board-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .artists-board-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9.5px;
      font-weight: 800;
      color: var(--active-color);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: color 0.35s ease;
    }

    .artists-board-hint {
      font-size: 8.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .artists-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px 6px;
    }

    .artist-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .artist-box.expanded {
      border-color: var(--active-color);
      background: rgba(255, 255, 255, 0.08);
    }

    .artist-main-row {
      padding: 4px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .artist-main-left {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
    }

    .artist-index {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 8.5px;
      font-weight: 800;
      color: var(--active-color);
      min-width: 12px;
    }

    .artist-name {
      font-size: 10.5px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-expand-indicator {
      font-size: 8px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .artist-box.expanded .artist-expand-indicator {
      transform: rotate(180deg);
      color: var(--active-color);
    }

    .artist-stream-tray {
      display: none;
      padding: 4px 6px 5px;
      gap: 5px;
      background: rgba(0, 0, 0, 0.45);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .artist-box.expanded .artist-stream-tray {
      display: flex;
    }

    .artist-stream-link {
      flex: 1;
      padding: 3px 4px;
      font-size: 8.5px;
      font-weight: 700;
      border-radius: 5px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: transform 0.1s ease;
    }

    .artist-stream-link:active {
      transform: scale(0.94);
    }

    .artist-stream-link.sp {
      background: rgba(29, 185, 84, 0.25);
      border: 1px solid rgba(29, 185, 84, 0.5);
    }

    .artist-stream-link.yt {
      background: rgba(255, 0, 51, 0.25);
      border: 1px solid rgba(255, 0, 51, 0.5);
    }

    /* =========================================================
       ROULETTE / RANDOMIZER STAGE WITH AUTO/MANUAL TOGGLE
       ========================================================= */
    .roller-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    /* Mode Segmented Switch */
    .mode-switch-row {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2px;
      gap: 4px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 4px 12px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mode-btn.active {
      background: var(--active-color);
      color: #000;
      box-shadow: 0 0 10px var(--active-color);
    }

    /* Auto View: Large Slot Reel */
    .reel-viewport {
      position: relative;
      width: 100%;
      height: 136px;
      background: #090b12;
      border-top: 1.5px solid rgba(255, 255, 255, 0.15);
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(to right, transparent, black 16%, black 84%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 16%, black 84%, transparent);
    }

    .center-laser {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      background: var(--active-color);
      box-shadow: 0 0 18px var(--active-color), 0 0 35px var(--active-color);
      z-index: 10;
      pointer-events: none;
      transition: background 0.35s ease, box-shadow 0.35s ease;
    }

    .center-laser::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 15px solid var(--active-color);
    }

    .center-laser::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 15px solid var(--active-color);
    }

    .reel-track {
      display: flex;
      align-items: center;
      position: absolute;
      left: 0;
      will-change: transform;
    }

    .reel-card {
      width: 152px;
      height: 108px;
      margin: 0 6px;
      background: #11131c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 12px;
      flex-shrink: 0;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
    }

    .reel-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--card-accent, #00ff88);
      box-shadow: 0 0 10px var(--card-accent, #00ff88);
    }

    .reel-card .card-cat {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--card-accent, #00ff88);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.5px;
    }

    .reel-card .card-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .reel-card .card-bpm {
      font-size: 9.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Manual View: Interactive Genre Browser Box */
    .manual-picker-container {
      display: none;
      width: 100%;
      height: 136px;
      background: #090b12;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 8px 10px;
      flex-direction: column;
      gap: 6px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .manual-picker-container.active {
      display: flex;
    }

    .manual-search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      outline: none;
    }

    .manual-search-input:focus {
      border-color: var(--active-color);
    }

    .manual-genre-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      overflow-y: auto;
      max-height: 85px;
      padding-right: 2px;
      scrollbar-width: thin;
    }

    .manual-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 10.5px;
      font-weight: 600;
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .manual-chip:active {
      transform: scale(0.95);
    }

    .manual-chip.selected {
      background: var(--active-color);
      color: #000;
      border-color: var(--active-color);
      font-weight: 800;
      box-shadow: 0 0 10px var(--active-color);
    }

    /* Open Case Button */
    .spin-bar-btn {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      background: radial-gradient(circle, #1a1c29 0%, #0d0e15 100%);
      border: 2px solid var(--active-color);
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 24px var(--active-color), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      transition: transform 0.15s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .spin-bar-btn:active {
      transform: scale(0.96);
    }

    .spin-bar-btn .btn-sub {
      font-size: 9.5px;
      color: var(--active-color);
      border: 1px solid var(--active-color);
      padding: 1px 6px;
      border-radius: 5px;
    }

    /* Modal / Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .drawer-overlay.open {
      display: flex;
    }

    .drawer-content {
      width: 100%;
      max-width: 440px;
      max-height: 75vh;
      background: #0d0f17;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px 20px 0 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.9);
      animation: slideUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-tabs {
      display: flex;
      gap: 8px;
    }

    .drawer-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .drawer-tab.active {
      color: #fff;
      border-color: var(--active-color);
    }

    .drawer-close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
    }

    .drawer-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      max-height: 55vh;
    }

    .drawer-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .drawer-item:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .drawer-item-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .drawer-item-sub {
      font-size: 9.5px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="ambient-glow" id="glow"></div>

  <!-- Header Nav & Category Filter -->
  <div class="header-bar">
    <div class="top-nav">
      <span class="app-title-badge" id="appBadge">100 Gen Z Genres</span>
      <button class="drawer-trigger-btn" id="openDrawerBtn">
        <span>⭐</span> Saved / History
      </button>
    </div>

    <!-- Category Filter Bar -->
    <div class="category-filter-row" id="categoryFilterRow">

      { name: "Mallsoft", rarity: "gold", color: "#a78bfa", category: "Internet Aesthetics", vibe: "Empty Shopping Mall", origin: "Online / US", era: "2014–Present", energy: "🛍️ Ethereal", artists: ["Disconscious", "Groceries", "Cat System Corp", " 식료품groceries", "Hantasi", "Vaporwave Mall", "Palm Mall", "Lindsheaven Virtual Plaza", "Corporate Mixtape", "Cosmic Cycler"], desc: "Ambient subgenre simulating the reverberant acoustics of abandoned shopping malls." },
      { name: "Chillhop / Lo-Fi", rarity: "blue", color: "#f59e0b", category: "Internet Aesthetics", vibe: "Study Beats", origin: "YouTube 24/7", era: "2016–Present", energy: "☕ Cozy", artists: ["Lofi Girl", "Kowloon", "ChilledCow", "Kupla", "Jinsang", "Nujabes (legacy)", " idealism", "potsu", "Saib", "SwuM"], desc: "Instrumental hip-hop with vinyl crackle and jazz loops soundtracking focus sessions." },
      { name: "Hypnagogic Pop", rarity: "gold", color: "#f9a8d4", category: "Internet Aesthetics", vibe: "Faded Radio Tape", origin: "US Indie", era: "2010s–Present", energy: "📼 Nostalgic", artists: ["Ariel Pink", "John Maus", "James Ferraro", "Ducktails", "The Skaters", "Panda Bear", "Sun Araw", "Oneohtrix Point Never", "Toro y Moi", "Neon Indian"], desc: "Nostalgic lo-fi music attempting to recreate radio memories through tape hiss." }
    ];

    const RARITY_MAP = {
      gold: { label: "🟡 GOLD SPECIAL", color: "#ffd700" },
      red: { label: "🔴 COVERT", color: "#ff3b30" },
      purple: { label: "🟣 CLASSIFIED", color: "#af52de" },
      blue: { label: "🔵 MIL-SPEC", color: "#007aff" }
    };

    let activeCategory = "ALL";
    let activePool = [...GENRES_100];
    let currentGenre = GENRES_100[75]; // Modern P-Pop
    let manualSelectedGenre = GENRES_100[75];
    let currentMode = "auto"; // "auto" or "manual"
    let recentPulls = [];
    let favorites = [];

    try {
      recentPulls = JSON.parse(localStorage.getItem('sonic_history') || '[]');
      favorites = JSON.parse(localStorage.getItem('sonic_favorites') || '[]');
    } catch(e) {}

    let audioCtx = null;
    let isRolling = false;
    const CARD_WIDTH = 164; // 152px width + 12px total margins
    let currentX = 0;
    let animationFrameId = null;

    const infoCard = document.getElementById('infoCard');
    const glow = document.getElementById('glow');
    const genreTitle = document.getElementById('genreTitle');
    const genreCategory = document.getElementById('genreCategory');
    const genreRarity = document.getElementById('genreRarity');
    const genreVibe = document.getElementById('genreVibe');
    const genreDesc = document.getElementById('genreDesc');
    const statOrigin = document.getElementById('statOrigin');
    const statEra = document.getElementById('statEra');
    const statEnergy = document.getElementById('statEnergy');
    const artistsGrid = document.getElementById('artistsGrid');
    const spotifyLink = document.getElementById('spotifyLink');
    const ytMusicLink = document.getElementById('ytMusicLink');
    const favBtn = document.getElementById('favBtn');
    const favIcon = document.getElementById('favIcon');
    const shareBtn = document.getElementById('shareBtn');
    const copyBtn = document.getElementById('copyBtn');
    const copyIcon = document.getElementById('copyIcon');
    
    const reelViewport = document.getElementById('reelViewport');
    const reelTrack = document.getElementById('reelTrack');
    const manualPickerContainer = document.getElementById('manualPickerContainer');
    const manualSearchInput = document.getElementById('manualSearchInput');
    const manualGenreChips = document.getElementById('manualGenreChips');
    const modeAutoBtn = document.getElementById('modeAutoBtn');
    const modeManualBtn = document.getElementById('modeManualBtn');

    const spinBtn = document.getElementById('spinBtn');
    const btnSub = document.getElementById('btnSub');
    const categoryFilterRow = document.getElementById('categoryFilterRow');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const openDrawerBtn = document.getElementById('openDrawerBtn');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const tabFavorites = document.getElementById('tabFavorites');
    const tabHistory = document.getElementById('tabHistory');
    const drawerList = document.getElementById('drawerList');
    const favCount = document.getElementById('favCount');

    function playTickSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(540, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}

      if (navigator.vibrate) navigator.vibrate(8);
    }

    function playWinSound(rarity) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (rarity === 'gold' || rarity === 'red') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + idx * 0.08);
            osc.stop(audioCtx.currentTime + idx * 0.08 + 0.4);
          });
          if (navigator.vibrate) navigator.vibrate([40, 50, 40, 50, 100]);
        } else {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.07);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.07 + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + idx * 0.07);
            osc.stop(audioCtx.currentTime + idx * 0.07 + 0.3);
          });
          if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
        }
      } catch(e) {}
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'reel-card';
      card.style.setProperty('--card-accent', item.color);
      card.innerHTML = `
        <span class="card-cat">${item.category}</span>
        <span class="card-name">${item.name}</span>
        <span class="card-bpm">${item.vibe}</span>
      `;
      return card;
    }

    let lastColor = "";
    function updateDetails(g, forceBump = false) {
      currentGenre = g;
      genreTitle.textContent = g.name;
      genreCategory.textContent = g.category;
      genreVibe.textContent = g.vibe;
      genreDesc.textContent = g.desc;
      statOrigin.textContent = g.origin || "Global";
      statEra.textContent = g.era || "2020s";
      statEnergy.textContent = g.energy || "⚡ High";

      const rInfo = RARITY_MAP[g.rarity] || RARITY_MAP.blue;
      genreRarity.textContent = rInfo.label;
      document.documentElement.style.setProperty('--rarity-color', rInfo.color);

      // Render Artists with Expansion for Spotify or YouTube Music
      artistsGrid.innerHTML = '';
      g.artists.forEach((artist, index) => {
        const box = document.createElement('div');
        box.className = 'artist-box';
        box.innerHTML = `
          <div class="artist-main-row">
            <div class="artist-main-left">
              <span class="artist-index">${(index + 1).toString().padStart(2, '0')}</span>
              <span class="artist-name">${artist}</span>
            </div>
            <span class="artist-expand-indicator">▼</span>
          </div>
          <div class="artist-stream-tray">
            <a href="https://open.spotify.com/search/${encodeURIComponent(artist)}" target="_blank" rel="noopener noreferrer" class="artist-stream-link sp">
              🟢 Spotify
            </a>
            <a href="https://music.youtube.com/search?q=${encodeURIComponent(artist)}" target="_blank" rel="noopener noreferrer" class="artist-stream-link yt">
              🔴 YT Music
            </a>
          </div>
        `;

        box.querySelector('.artist-main-row').addEventListener('click', () => {
          const isExp = box.classList.contains('expanded');
          document.querySelectorAll('.artist-box').forEach(b => b.classList.remove('expanded'));
          if (!isExp) box.classList.add('expanded');
        });

        artistsGrid.appendChild(box);
      });

      const query = encodeURIComponent(g.name + " music");
      spotifyLink.href = `https://open.spotify.com/search/${query}`;
      ytMusicLink.href = `https://music.youtube.com/search?q=${query}`;

      updateFavButtonState();

      if (lastColor !== g.color) {
        document.documentElement.style.setProperty('--active-color', g.color);
        glow.style.background = `radial-gradient(circle, ${g.color}55 0%, transparent 70%)`;
        lastColor = g.color;
      }

      if (forceBump) {
        infoCard.classList.remove('bump');
        void infoCard.offsetWidth;
        infoCard.classList.add('bump');
      }
    }

    function isFavorited(genreName) {
      return favorites.some(item => item.name === genreName);
    }

    function updateFavButtonState() {
      if (isFavorited(currentGenre.name)) {
        favBtn.classList.add('active');
        favIcon.textContent = '★';
      } else {
        favBtn.classList.remove('active');
        favIcon.textContent = '☆';
      }
      favCount.textContent = favorites.length;
    }

    favBtn.addEventListener('click', () => {
      if (isFavorited(currentGenre.name)) {
        favorites = favorites.filter(item => item.name !== currentGenre.name);
      } else {
        favorites.unshift(currentGenre);
      }
      try {
        localStorage.setItem('sonic_favorites', JSON.stringify(favorites));
      } catch(e) {}
      updateFavButtonState();
      if (navigator.vibrate) navigator.vibrate(15);
    });

    shareBtn.addEventListener('click', async () => {
      const shareData = {
        title: `Explore ${currentGenre.name}`,
        text: `Check out ${currentGenre.name} (${currentGenre.category})! Key artists: ${currentGenre.artists.slice(0, 3).join(', ')}.`,
        url: `https://open.spotify.com/search/${encodeURIComponent(currentGenre.name + " music")}`
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch(e) {}
      } else {
        try {
          await navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`);
          alert("Genre info copied to clipboard!");
        } catch(e) {}
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(currentGenre.name);
        copyIcon.textContent = '✅';
        if (navigator.vibrate) navigator.vibrate(20);
        setTimeout(() => { copyIcon.textContent = '📋'; }, 1800);
      } catch (err) {
        alert("Copied: " + currentGenre.name);
      }
    });

    function addToHistory(genre) {
      recentPulls = recentPulls.filter(item => item.name !== genre.name);
      recentPulls.unshift(genre);
      if (recentPulls.length > 10) recentPulls.pop();
      try {
        localStorage.setItem('sonic_history', JSON.stringify(recentPulls));
      } catch(e) {}
    }

    // Manual Mode Browser Render
    function renderManualChips(filterText = "") {
      manualGenreChips.innerHTML = '';
      const filtered = activePool.filter(g => g.name.toLowerCase().includes(filterText.toLowerCase()));

      if (filtered.length === 0) {
        manualGenreChips.innerHTML = `<span style="font-size:10px; color:var(--text-muted); padding:4px;">No genres match search</span>`;
        return;
      }

      filtered.forEach(g => {
        const chip = document.createElement('div');
        chip.className = 'manual-chip' + (manualSelectedGenre.name === g.name ? ' selected' : '');
        chip.textContent = g.name;
        chip.addEventListener('click', () => {
          manualSelectedGenre = g;
          document.querySelectorAll('.manual-chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          if (navigator.vibrate) navigator.vibrate(10);
        });
        manualGenreChips.appendChild(chip);
      });
    }

    manualSearchInput.addEventListener('input', (e) => {
      renderManualChips(e.target.value);
    });

    // Mode Toggle Switching
    modeAutoBtn.addEventListener('click', () => {
      if (currentMode === "auto" || isRolling) return;
      currentMode = "auto";
      modeAutoBtn.classList.add('active');
      modeManualBtn.classList.remove('active');
      reelViewport.style.display = "flex";
      manualPickerContainer.classList.remove('active');
      initReel();
    });

    modeManualBtn.addEventListener('click', () => {
      if (currentMode === "manual" || isRolling) return;
      currentMode = "manual";
      modeManualBtn.classList.add('active');
      modeAutoBtn.classList.remove('active');
      reelViewport.style.display = "none";
      manualPickerContainer.classList.add('active');
      renderManualChips();
    });

    // Category Filter Selection
    categoryFilterRow.addEventListener('click', (e) => {
      const chip = e.target.closest('.filter-chip');
      if (!chip || isRolling) return;

      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');

      activeCategory = chip.dataset.cat;
      if (activeCategory === "ALL") {
        activePool = [...GENRES_100];
        btnSub.textContent = "100 GENRES";
      } else {
        activePool = GENRES_100.filter(g => g.category === activeCategory);
        btnSub.textContent = `${activePool.length} GENRES`;
      }

      if (currentMode === "auto") {
        initReel();
      } else {
        manualSearchInput.value = "";
        manualSelectedGenre = activePool[0] || GENRES_100[0];
        renderManualChips();
      }
    });

    let reelCardsArray = [];
    function initReel() {
      reelTrack.innerHTML = '';
      reelCardsArray = [];
      for (let i = 0; i < 20; i++) {
        const randomItem = activePool[Math.floor(Math.random() * activePool.length)];
        reelCardsArray.push(randomItem);
        reelTrack.appendChild(createCardElement(randomItem));
      }
      const viewportCenter = reelViewport.offsetWidth / 2;
      currentX = viewportCenter - (2 * CARD_WIDTH + CARD_WIDTH / 2);
      reelTrack.style.transform = `translateX(${currentX}px)`;
    }

    // Master Open Case Function (Works for Both Modes)
    function openCaseAction() {
      if (isRolling) return;

      if (currentMode === "manual") {
        // Manual Mode: Immediate reveal or fast targeted confirmation
        addToHistory(manualSelectedGenre);
        updateDetails(manualSelectedGenre, true);
        playWinSound(manualSelectedGenre.rarity);
      } else {
        // Auto Mode: High-speed CS:GO Roulette Deceleration
        isRolling = true;
        const TOTAL_SPIN_ITEMS = 60;
        const WINNING_INDEX = 52;
        const winningGenre = activePool[Math.floor(Math.random() * activePool.length)];

        reelTrack.innerHTML = '';
        reelCardsArray = [];

        for (let i = 0; i < TOTAL_SPIN_ITEMS; i++) {
          let item = (i === WINNING_INDEX) ? winningGenre : activePool[Math.floor(Math.random() * activePool.length)];
          reelCardsArray.push(item);
          reelTrack.appendChild(createCardElement(item));
        }

        const viewportCenter = reelViewport.offsetWidth / 2;
        const startX = viewportCenter - (2 * CARD_WIDTH + CARD_WIDTH / 2);
        const randomSubOffset = (Math.random() * 60) - 30;
        const targetX = viewportCenter - (WINNING_INDEX * CARD_WIDTH + CARD_WIDTH / 2 + randomSubOffset);

        let startTime = null;
        const duration = 5100;

        function easeOutCubicBezier(t) {
          return 1 - Math.pow(1 - t, 4.2);
        }

        let lastIndexPassed = -1;

        function animateReel(timestamp) {
          if (!startTime) startTime = timestamp;
          const elapsed = timestamp - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = easeOutCubicBezier(progress);

          currentX = startX + (targetX - startX) * ease;
          reelTrack.style.transform = `translateX(${currentX}px)`;

          const currentCenterCardIdx = Math.round((viewportCenter - currentX - CARD_WIDTH / 2) / CARD_WIDTH);
          if (currentCenterCardIdx >= 0 && currentCenterCardIdx < reelCardsArray.length) {
            if (currentCenterCardIdx !== lastIndexPassed) {
              playTickSound();
              lastIndexPassed = currentCenterCardIdx;
              updateDetails(reelCardsArray[currentCenterCardIdx], false);
            }
          }

          if (progress < 1) {
            animationFrameId = requestAnimationFrame(animateReel);
          } else {
            isRolling = false;
            addToHistory(winningGenre);
            updateDetails(winningGenre, true);
            playWinSound(winningGenre.rarity);
          }
        }

        animationFrameId = requestAnimationFrame(animateReel);
      }
    }

    spinBtn.addEventListener('click', openCaseAction);

    // Drawer System
    let activeDrawerTab = 'favorites';

    function renderDrawerList() {
      drawerList.innerHTML = '';
      const listToRender = (activeDrawerTab === 'favorites') ? favorites : recentPulls;

      if (listToRender.length === 0) {
        drawerList.innerHTML = `<div style="text-align:center; padding: 24px 0; color: var(--text-muted); font-size:12px;">No items saved yet.</div>`;
        return;
      }

      listToRender.forEach(genre => {
        const item = document.createElement('div');
        item.className = 'drawer-item';
        item.innerHTML = `
          <div>
            <div class="drawer-item-title">${genre.name}</div>
            <div class="drawer-item-sub">${genre.category} • ${genre.vibe}</div>
          </div>
          <span style="font-size:14px; color:var(--active-color);">➔</span>
        `;
        item.addEventListener('click', () => {
          updateDetails(genre, true);
          drawerOverlay.classList.remove('open');
        });
        drawerList.appendChild(item);
      });
    }

    openDrawerBtn.addEventListener('click', () => {
      renderDrawerList();
      drawerOverlay.classList.add('open');
    });

    closeDrawerBtn.addEventListener('click', () => {
      drawerOverlay.classList.remove('open');
    });

    drawerOverlay.addEventListener('click', (e) => {
      if (e.target === drawerOverlay) drawerOverlay.classList.remove('open');
    });

    tabFavorites.addEventListener('click', () => {
      activeDrawerTab = 'favorites';
      tabFavorites.classList.add('active');
      tabHistory.classList.remove('active');
      renderDrawerList();
    });

    tabHistory.addEventListener('click', () => {
      activeDrawerTab = 'history';
      tabHistory.classList.add('active');
      tabFavorites.classList.remove('active');
      renderDrawerList();
    });

    window.addEventListener('load', () => {
      initReel();
      renderManualChips();
      updateDetails(GENRES_100.find(g => g.name === "Modern P-Pop") || GENRES_100[0]);
    });
    window.addEventListener('resize', initReel);
  </script>
</body>
</html>
