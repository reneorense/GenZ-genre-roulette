<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gen Z Genre Roller</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#06070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #06070b;
      --card-bg: rgba(13, 15, 24, 0.94);
      --active-color: #00ff88;
      --spotify: #1db954;
      --ytmusic: #ff0033;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 8px 0;
    }

    /* Ambient Dynamic Glow */
    .ambient-glow {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.25) 0%, transparent 70%);
      filter: blur(65px);
      z-index: 0;
      pointer-events: none;
      transition: background 0.35s ease;
    }

    /* Top Information Section */
    .top-section {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--active-color);
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--active-color);
      padding: 3px 12px;
      border-radius: 20px;
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.25);
      transition: all 0.35s ease;
    }

    .info-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid var(--active-color);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.35s ease;
    }

    .info-card.bump {
      transform: scale(1.02);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-pill {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--active-color);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--active-color);
      padding: 2px 8px;
      border-radius: 6px;
      transition: all 0.35s ease;
    }

    .vibe-text {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .genre-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--active-color);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .copy-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.2);
    }

    .genre-description {
      font-size: 12px;
      line-height: 1.35;
      color: #d1d5db;
      min-height: 32px;
    }

    /* Meta Details Pill Grid */
    .genre-quick-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: rgba(0, 0, 0, 0.35);
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .stat-label {
      font-size: 8.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 10.5px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
    }

    /* Top 10 Artists Scroll Container */
    .artists-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .artists-header {
      font-size: 9px;
      font-weight: 800;
      color: var(--active-color);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transition: color 0.35s ease;
    }

    .artists-scroll-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .artists-scroll-row::-webkit-scrollbar {
      display: none;
    }

    .artist-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      color: #f1f5f9;
    }

    /* Music Streaming Links */
    .links-row {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .music-link-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .music-link-btn.spotify {
      border-color: rgba(29, 185, 84, 0.4);
    }

    .music-link-btn.spotify:active {
      background: rgba(29, 185, 84, 0.2);
      transform: scale(0.96);
    }

    .music-link-btn.ytmusic {
      border-color: rgba(255, 0, 51, 0.4);
    }

    .music-link-btn.ytmusic:active {
      background: rgba(255, 0, 51, 0.2);
      transform: scale(0.96);
    }

    .music-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .spotify .music-dot { background: var(--spotify); box-shadow: 0 0 6px var(--spotify); }
    .ytmusic .music-dot { background: var(--ytmusic); box-shadow: 0 0 6px var(--ytmusic); }

    /* =========================================================
       CENTER AUDIO SPECTRUM VISUALIZER
       ========================================================= */
    .visualizer-stage {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      z-index: 2;
    }

    .spectrum-bar {
      width: 4px;
      height: 12px;
      background: var(--active-color);
      border-radius: 4px;
      box-shadow: 0 0 8px var(--active-color);
      transition: height 0.08s ease, background 0.35s ease, box-shadow 0.35s ease;
    }

    /* =========================================================
       CS:GO / CASINO HORIZONTAL ROLLER SECTION
       ========================================================= */
    .roller-container {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 2;
    }

    .reel-viewport {
      position: relative;
      width: 100%;
      height: 114px;
      background: #090b12;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(to right, transparent, black 18%, black 82%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 18%, black 82%, transparent);
    }

    .center-laser {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      background: var(--active-color);
      box-shadow: 0 0 14px var(--active-color), 0 0 24px var(--active-color);
      z-index: 10;
      pointer-events: none;
      transition: background 0.35s ease, box-shadow 0.35s ease;
    }

    .center-laser::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 12px solid var(--active-color);
      transition: border-top-color 0.35s ease;
    }

    .center-laser::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 12px solid var(--active-color);
      transition: border-bottom-color 0.35s ease;
    }

    .reel-track {
      display: flex;
      align-items: center;
      position: absolute;
      left: 0;
      will-change: transform;
    }

    .reel-card {
      width: 124px;
      height: 90px;
      margin: 0 4px;
      background: #11131c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 9px;
      flex-shrink: 0;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
      transition: border-color 0.2s ease, transform 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .reel-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--card-accent, #00ff88);
      box-shadow: 0 0 8px var(--card-accent, #00ff88);
    }

    .reel-card .card-cat {
      font-size: 8.5px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--card-accent, #00ff88);
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reel-card .card-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .reel-card .card-bpm {
      font-size: 9px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .spin-bar-btn {
      width: calc(100% - 36px);
      max-width: 420px;
      height: 50px;
      border-radius: 14px;
      background: radial-gradient(circle, #1a1c29 0%, #0d0e15 100%);
      border: 2px solid var(--active-color);
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 20px var(--active-color), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      transition: transform 0.15s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .spin-bar-btn:active {
      transform: scale(0.96);
    }

    .spin-bar-btn .btn-sub {
      font-size: 10px;
      color: var(--active-color);
      border: 1px solid var(--active-color);
      padding: 1px 6px;
      border-radius: 6px;
      transition: all 0.35s ease;
    }
  </style>
</head>
<body>

  <div class="ambient-glow" id="glow"></div>

  <!-- Top Info Card -->
  <div class="top-section">
    <div class="badge" id="appBadge">100 Gen Z Genres</div>
    <div class="info-card" id="infoCard">
      
      <div class="card-meta">
        <span class="category-pill" id="genreCategory">Glitch & Digital</span>
        <span class="vibe-text" id="genreVibe">Maximalist • High BPM</span>
      </div>

      <div class="title-row">
        <h2 class="genre-name" id="genreTitle">Hyperpop</h2>
        <button class="copy-btn" id="copyBtn">
          <span id="copyIcon">📋</span>
          <span id="copyText">COPY</span>
        </button>
      </div>

      <p class="genre-description" id="genreDesc">Pushed maximalist, pitch-shifted pop into abrasive, distorted synths and high-BPM chaos.</p>
      
      <!-- Quick Stats Meta Grid -->
      <div class="genre-quick-stats">
        <div class="stat-box">
          <span class="stat-label">ORIGIN</span>
          <span class="stat-value" id="statOrigin">Internet / PC Music</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">PEAK ERA</span>
          <span class="stat-value" id="statEra">2019 – Present</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">ENERGY</span>
          <span class="stat-value" id="statEnergy">⚡ Overdrive</span>
        </div>
      </div>

      <!-- Top 10 Artists Badges -->
      <div class="artists-section">
        <span class="artists-header" id="artistsHeader">Top Artists</span>
        <div class="artists-scroll-row" id="artistsContainer"></div>
      </div>

      <!-- Streaming Links -->
      <div class="links-row">
        <a href="#" target="_blank" class="music-link-btn spotify" id="spotifyLink">
          <span class="music-dot"></span> Spotify
        </a>
        <a href="#" target="_blank" class="music-link-btn ytmusic" id="ytMusicLink">
          <span class="music-dot"></span> YouTube Music
        </a>
      </div>

    </div>
  </div>

  <!-- Center Equalizer Visualizer Stage -->
  <div class="visualizer-stage" id="visualizer">
    <!-- 28 Spectrum Neon Bars -->
  </div>

  <!-- Bottom CS:GO Slot Roller Section -->
  <div class="roller-container">
    <div class="reel-viewport" id="reelViewport">
      <div class="center-laser"></div>
      <div class="reel-track" id="reelTrack"></div>
    </div>

    <button class="spin-bar-btn" id="spinBtn">
      OPEN CASE
      <span class="btn-sub" id="btnSub">100 GENRES</span>
    </button>
  </div>

    const visualizer = document.getElementById('visualizer');
    const reelViewport = document.getElementById('reelViewport');
    const reelTrack = document.getElementById('reelTrack');
    const spinBtn = document.getElementById('spinBtn');
    const infoCard = document.getElementById('infoCard');
    const glow = document.getElementById('glow');
    const appBadge = document.getElementById('appBadge');
    const artistsHeader = document.getElementById('artistsHeader');
    const artistsContainer = document.getElementById('artistsContainer');
    const spotifyLink = document.getElementById('spotifyLink');
    const ytMusicLink = document.getElementById('ytMusicLink');
    const copyBtn = document.getElementById('copyBtn');
    const copyText = document.getElementById('copyText');
    const copyIcon = document.getElementById('copyIcon');
    const btnSub = document.getElementById('btnSub');

    const genreTitle = document.getElementById('genreTitle');
    const genreCategory = document.getElementById('genreCategory');
    const genreVibe = document.getElementById('genreVibe');
    const genreDesc = document.getElementById('genreDesc');
    const statOrigin = document.getElementById('statOrigin');
    const statEra = document.getElementById('statEra');
    const statEnergy = document.getElementById('statEnergy');

    let audioCtx = null;
    let isRolling = false;
    const CARD_WIDTH = 132;
    let reelCardsArray = [];
    let currentX = 0;
    let animationFrameId = null;

    // Create 28 Equalizer Visualizer Bars
    const TOTAL_BARS = 28;
    const barsArray = [];
    for (let i = 0; i < TOTAL_BARS; i++) {
      const bar = document.createElement('div');
      bar.className = 'spectrum-bar';
      visualizer.appendChild(bar);
      barsArray.push(bar);
    }

    // Spectrum Animation Loop
    function updateVisualizer(intensity = 0.25) {
      barsArray.forEach((bar, idx) => {
        const factor = Math.sin(Date.now() * 0.008 + idx * 0.4) * 0.5 + 0.5;
        const randomHeight = Math.floor(factor * (intensity * 46) + 6);
        bar.style.height = `${Math.min(52, Math.max(6, randomHeight))}px`;
      });
    }

    let visLoop = setInterval(() => {
      if (!isRolling) updateVisualizer(0.2);
    }, 100);

    // Realistic Web Audio FX
    function playTickSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}

      if (navigator.vibrate) {
        navigator.vibrate(10);
      }
    }

    function playWinSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.07);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.07 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.07);
          osc.stop(audioCtx.currentTime + idx * 0.07 + 0.3);
        });
      } catch(e) {}

      if (navigator.vibrate) {
        navigator.vibrate([35, 45, 65]);
      }
    }

    // Build the Card DOM
    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'reel-card';
      card.style.setProperty('--card-accent', item.color);
      card.innerHTML = `
        <span class="card-cat">${item.category}</span>
        <span class="card-name">${item.name}</span>
        <span class="card-bpm">${item.vibe}</span>
      `;
      return card;
    }

    // Update Top Info Screen
    let lastColor = "";
    function updateDetails(g, forceBump = false) {
      genreTitle.textContent = g.name;
      genreCategory.textContent = g.category;
      genreVibe.textContent = g.vibe;
      genreDesc.textContent = g.desc;
      statOrigin.textContent = g.origin || "Global";
      statEra.textContent = g.era || "2020s";
      statEnergy.textContent = g.energy || "⚡ High";

      // Render Top 10 Artist Badges
      artistsContainer.innerHTML = '';
      g.artists.forEach(artist => {
        const chip = document.createElement('span');
        chip.className = 'artist-chip';
        chip.textContent = artist;
        artistsContainer.appendChild(chip);
      });

      // Streaming Links
      const query = encodeURIComponent(g.name + " music");
      spotifyLink.href = `https://open.spotify.com/search/${query}`;
      ytMusicLink.href = `https://music.youtube.com/search?q=${query}`;

      // Update Theme Colors
      if (lastColor !== g.color) {
        document.documentElement.style.setProperty('--active-color', g.color);
        glow.style.background = `radial-gradient(circle, ${g.color}55 0%, transparent 70%)`;
        lastColor = g.color;
      }

      if (forceBump) {
        infoCard.classList.remove('bump');
        void infoCard.offsetWidth;
        infoCard.classList.add('bump');
      }
    }

    // Populate Initial Horizontal Reel
    function initReel() {
      reelTrack.innerHTML = '';
      reelCardsArray = [];
      for (let i = 0; i < 20; i++) {
        const randomItem = GENRES_100[Math.floor(Math.random() * GENRES_100.length)];
        reelCardsArray.push(randomItem);
        reelTrack.appendChild(createCardElement(randomItem));
      }
      const viewportCenter = reelViewport.offsetWidth / 2;
      currentX = viewportCenter - (2 * CARD_WIDTH + CARD_WIDTH / 2);
      reelTrack.style.transform = `translateX(${currentX}px)`;
      updateDetails(reelCardsArray[2]);
    }

    // CS:GO Style Spin Simulation
    function spinReel() {
      if (isRolling) return;
      isRolling = true;

      const TOTAL_SPIN_ITEMS = 65;
      const WINNING_INDEX = 56;
      const winningGenre = GENRES_100[Math.floor(Math.random() * GENRES_100.length)];

      reelTrack.innerHTML = '';
      reelCardsArray = [];

      for (let i = 0; i < TOTAL_SPIN_ITEMS; i++) {
        let item = (i === WINNING_INDEX) ? winningGenre : GENRES_100[Math.floor(Math.random() * GENRES_100.length)];
        reelCardsArray.push(item);
        reelTrack.appendChild(createCardElement(item));
      }

      const viewportCenter = reelViewport.offsetWidth / 2;
      const startX = viewportCenter - (2 * CARD_WIDTH + CARD_WIDTH / 2);
      const randomSubOffset = (Math.random() * 64) - 32;
      const targetX = viewportCenter - (WINNING_INDEX * CARD_WIDTH + CARD_WIDTH / 2 + randomSubOffset);

      let startTime = null;
      const duration = 5200;

      function easeOutCubicBezier(t) {
        return 1 - Math.pow(1 - t, 4.2);
      }

      let lastIndexPassed = -1;

      function animateReel(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = easeOutCubicBezier(progress);

        currentX = startX + (targetX - startX) * ease;
        reelTrack.style.transform = `translateX(${currentX}px)`;

        // Turbo visualizer waves while rolling
        updateVisualizer(1.0 - ease * 0.6);

        const currentCenterCardIdx = Math.round((viewportCenter - currentX - CARD_WIDTH / 2) / CARD_WIDTH);
        if (currentCenterCardIdx >= 0 && currentCenterCardIdx < reelCardsArray.length) {
          if (currentCenterCardIdx !== lastIndexPassed) {
            playTickSound();
            lastIndexPassed = currentCenterCardIdx;
            updateDetails(reelCardsArray[currentCenterCardIdx], false);
          }
        }

        if (progress < 1) {
          animationFrameId = requestAnimationFrame(animateReel);
        } else {
          isRolling = false;
          updateDetails(winningGenre, true);
          playWinSound();
        }
      }

      animationFrameId = requestAnimationFrame(animateReel);
    }

    // One-Tap Copy Genre Name
    copyBtn.addEventListener('click', async () => {
      const currentGenreName = genreTitle.textContent;
      try {
        await navigator.clipboard.writeText(currentGenreName);
        copyIcon.textContent = '✅';
        copyText.textContent = 'COPIED!';
        if (navigator.vibrate) navigator.vibrate(20);
        setTimeout(() => {
          copyIcon.textContent = '📋';
          copyText.textContent = 'COPY';
        }, 1800);
      } catch (err) {
        alert("Copied: " + currentGenreName);
      }
    });

    spinBtn.addEventListener('click', spinReel);

    window.addEventListener('load', () => {
      initReel();
      updateDetails(GENRES_100[0]);
    });
    window.addEventListener('resize', initReel);
  </script>
