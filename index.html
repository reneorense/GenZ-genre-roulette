<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gen Z Genre Roulette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090c;
      --card-bg: rgba(22, 22, 30, 0.9);
      --border: rgba(255, 255, 255, 0.1);
      --neon: #00ff88;
      --accent: #00f0ff;
      --pink: #ff007f;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Ambient Header Glow */
    .glow {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
      transition: background 0.4s ease;
    }

    /* Top Information Area */
    .top-section {
      position: relative;
      z-index: 2;
      padding: 14px 18px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--neon);
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.3);
      padding: 3px 10px;
      border-radius: 20px;
    }

    .info-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s ease;
    }

    .info-card.bump {
      transform: scale(1.02);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-pill {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .vibe-text {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .genre-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
    }

    .genre-description {
      font-size: 12.5px;
      line-height: 1.4;
      color: #cbd5e1;
      min-height: 36px;
    }

    .artist-row {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
    }

    .artist-label {
      font-weight: 800;
      color: var(--pink);
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.5px;
    }

    .artist-list {
      color: #ffffff;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom Roulette Stage */
    .roulette-wrapper {
      position: relative;
      width: 100%;
      height: 48vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 1;
    }

    .marker {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 22px solid var(--neon);
      z-index: 10;
      filter: drop-shadow(0 2px 8px rgba(0, 255, 136, 0.9));
    }

    .canvas-container {
      position: absolute;
      top: 18px;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 255, 136, 0.2);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }

    .spin-center-btn {
      position: absolute;
      top: calc(18px + 220px);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #252535 0%, #101017 100%);
      border: 3px solid var(--neon);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.2);
      z-index: 9;
      transition: transform 0.15s ease;
    }

    .spin-center-btn:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    .spin-center-btn span {
      font-size: 9px;
      color: var(--neon);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="glow" id="glow"></div>

  <!-- Top Info -->
  <div class="top-section">
    <div class="badge">100 Gen Z Genres</div>
    <div class="info-card" id="infoCard">
      <div class="card-meta">
        <span class="category-pill" id="genreCategory">Rage & Rap</span>
        <span class="vibe-text" id="genreVibe">Moshpit • 145 BPM</span>
      </div>
      <h2 class="genre-name" id="genreTitle">Rage Rap</h2>
      <p class="genre-description" id="genreDesc">Trap driven by euphoric, buzzing EDM synthesizer leads, distorted 808s, and hyper-futuristic rhythms.</p>
      <div class="artist-row">
        <span class="artist-label">Artists</span>
        <span class="artist-list" id="genreArtists">Playboi Carti, Yeat, Ken Carson</span>
      </div>
    </div>
  </div>

  <!-- Bottom Wheel -->
  <div class="roulette-wrapper">
    <div class="marker"></div>
    <div class="canvas-container">
      <canvas id="wheelCanvas" width="880" height="880"></canvas>
    </div>
    <button class="spin-center-btn" id="spinBtn">
      SPIN
      <span>TAP HERE</span>
    </button>
  </div>

  <script>
    const GENRES = [
      { name: "Rage Rap", category: "Rage & Rap", vibe: "Moshpit • 145 BPM", artists: "Playboi Carti, Yeat, Ken Carson", desc: "Trap driven by buzzing EDM synthesizer leads, distorted 808s, and futuristic rhythms." },
      { name: "Hyperpop", category: "Digital & Glitch", vibe: "Maximalist Pop", artists: "100 gecs, SOPHIE, Charli xcx", desc: "Maximalist pop pushed into abrasive synthetic sound design and pitch-shifted vocals." },
      { name: "Drift Phonk", category: "Phonk & Dance", vibe: "Cowbell • 160 BPM", artists: "Kordhell, DVRST, Hensonn", desc: "Memphis rap acapellas combined with aggressive cowbells and car-drift aesthetics." },
      { name: "Bedroom Pop", category: "Indie & Alt", vibe: "Chill • Lo-Fi Tape", artists: "Clairo, Beabadoobee, Cavetown", desc: "Intimate DIY home recordings with chorus guitars, vintage keys, and delicate vocals." },
      { name: "Brazilian Phonk", category: "Phonk & Dance", vibe: "Baile • 130 BPM", artists: "Phonkha, Slowboy, DJ FKU", desc: "Favela funk rhythms fused with distorted phonk cowbells and heavy sub bass." },
      { name: "Digicore", category: "Digital & Glitch", vibe: "Discord-Native", artists: "Jane Remover, midwxst, quinn", desc: "Hyperpop evolution mixing autotuned singing, bitcrushed chords, and fast breaks." },
      { name: "PluggnB", category: "Rage & Rap", vibe: "Smooth 808s", artists: "Autumn!, Summrs, Kankan", desc: "Melodic fusion of minimalist plugg beats with 2000s R&B vocal runs and bright bells." },
      { name: "Nu-Gaze", category: "Rock & Guitar", vibe: "Fuzz Shoegaze", artists: "Wisp, Julie, Narrow Head", desc: "Gen Z revival of 90s shoegaze, featuring walls of fuzz pedals and whispery vocals." },
      { name: "Slowed + Reverb", category: "Internet Vibe", vibe: "Liminal Headspace", artists: "TikTok & YouTube Creators", desc: "Pitched-down, space-drenched songs creating a dreamy late-night emotional vibe." },
      { name: "Amapiano", category: "Global Club", vibe: "Log Drum Bass", artists: "Uncle Waffles, Kabza De Small", desc: "South African house hybrid of deep synths, soulful jazz chords, and wooden log drums." },
      { name: "Breakcore", category: "Digital & Glitch", vibe: "Frenetic • 180 BPM", artists: "Sewerslvt, Vertigoaway", desc: "Manic chopped drum breaks colliding with anime soundbites and ambient pads." },
      { name: "Corridos Tumbados", category: "Global Waves", vibe: "Brass & Trap", artists: "Peso Pluma, Natanael Cano", desc: "Traditional Mexican requinto guitars and brass horns fused with trap cadences." },
      { name: "Krushclub", category: "Rage & Rap", vibe: "Fast Nightcore", artists: "Odetari, Lumi Athena, Asteria", desc: "Fast-paced cross between Jersey club kicks, nightcore hooks, and rage synths." },
      { name: "Deftones-Core", category: "Rock & Guitar", vibe: "Alt-Metal Wave", artists: "Fleshwater, Loathe, Moodring", desc: "Drop-tuned heavy riffs meeting ethereal whispering vocals and 90s grunge bridges." },
      { name: "Sad Girl Indie", category: "Indie & Alt", vibe: "Poetic & Stripped", artists: "Phoebe Bridgers, boygenius, Gracie", desc: "Confessional, poetic indie folk built around acoustic guitars and raw vocal stories." },
      { name: "Jersey Club", category: "Phonk & Dance", vibe: "5-Beat Bounce", artists: "Bandmanrill, Lil Uzi Vert", desc: "Syncopated five-beat kick pattern accented by vocal chops and rapid bounce rhythms." },
      { name: "Fast Techno", category: "Phonk & Dance", vibe: "155 BPM Rave", artists: "Creeds, Sara Landry, Nico Moreno", desc: "Hard techno and schranz kicks paired with energetic melodic top-lines." },
      { name: "Modern Bossa", category: "Indie & Alt", vibe: "Jazz Bedroom Pop", artists: "Laufey", desc: "Brazilian Bossa Nova chords and vintage big-band style with modern youth lyrics." },
      { name: "5th Gen K-Pop", category: "Global Waves", vibe: "Liquid DnB Pop", artists: "NewJeans, ILLIT", desc: "K-pop embracing early 2000s liquid drum & bass breaks and breezy vocal delivery." },
      { name: "Dariacore", category: "Digital & Glitch", vibe: "Meme Chop Chaos", artists: "leroy / Jane Remover", desc: "High-speed Jersey breakbeats layered with rapid 2000s pop and internet meme samples." }
    ];

    const COLORS = [
      "#00ff88", "#00f0ff", "#ff007f", "#9d4edd", 
      "#ffea00", "#ff5400", "#70e000", "#0077b6", 
      "#e01a4f", "#7209b7", "#38b000", "#4cc9f0"
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const infoCard = document.getElementById('infoCard');
    const glow = document.getElementById('glow');

    const genreTitle = document.getElementById('genreTitle');
    const genreCategory = document.getElementById('genreCategory');
    const genreVibe = document.getElementById('genreVibe');
    const genreDesc = document.getElementById('genreDesc');
    const genreArtists = document.getElementById('genreArtists');

    const total = GENRES.length;
    const sliceAngle = (2 * Math.PI) / total;
    let currentAngle = 0;
    let velocity = 0;
    let isSpinning = false;

    function renderWheel() {
      const size = canvas.width;
      const radius = size / 2;

      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.translate(radius, radius);
      ctx.rotate(currentAngle);

      for (let i = 0; i < total; i++) {
        const start = i * sliceAngle;
        const end = start + sliceAngle;

        // Slice Background
        ctx.beginPath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius - 10, start, end);
        ctx.lineTo(0, 0);
        ctx.fill();

        // Border Line
        ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Slice Label Text
        ctx.save();
        ctx.fillStyle = "#000000";
        ctx.font = "bold 24px 'Space Grotesk', sans-serif";
        ctx.translate(
          Math.cos(start + sliceAngle / 2) * (radius - 120),
          Math.sin(start + sliceAngle / 2) * (radius - 120)
        );
        ctx.rotate(start + sliceAngle / 2 + Math.PI);
        ctx.fillText(GENRES[i].name, 0, 8);
        ctx.restore();
      }

      // Outer Rim Glow
      ctx.beginPath();
      ctx.arc(0, 0, radius - 5, 0, 2 * Math.PI);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
      ctx.lineWidth = 8;
      ctx.stroke();

      ctx.restore();
    }

    function getCurrentIndex() {
      const normalized = (currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      let pointerAngle = (3 * Math.PI / 2 - normalized) % (2 * Math.PI);
      if (pointerAngle < 0) pointerAngle += 2 * Math.PI;
      return Math.floor(pointerAngle / sliceAngle) % total;
    }

    function updateDetails(idx) {
      const g = GENRES[idx];
      genreTitle.textContent = g.name;
      genreCategory.textContent = g.category;
      genreVibe.textContent = g.vibe;
      genreDesc.textContent = g.desc;
      genreArtists.textContent = g.artists;

      const color = COLORS[idx % COLORS.length];
      glow.style.background = `radial-gradient(circle, ${color}55 0%, transparent 70%)`;
      genreCategory.style.borderColor = color;
      genreCategory.style.color = color;

      infoCard.classList.remove('bump');
      void infoCard.offsetWidth;
      infoCard.classList.add('bump');
    }

    function spinAnimation() {
      if (velocity > 0.001) {
        currentAngle += velocity;
        velocity *= 0.985;
        renderWheel();
        requestAnimationFrame(spinAnimation);
      } else {
        isSpinning = false;
        velocity = 0;
        updateDetails(getCurrentIndex());
      }
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      velocity = Math.random() * 0.25 + 0.35;
      spinAnimation();
    }

    spinBtn.addEventListener('click', spin);
    canvas.addEventListener('click', spin);

    // Initial load
    renderWheel();
    updateDetails(0);
  </script>
</body>
</html>
